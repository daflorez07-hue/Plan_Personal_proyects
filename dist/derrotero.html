<title>Derrotero</title>
<meta name="description" content="Plan personal de David Flórez Sierra, sep 2026 – jun 2027: actividades, indicadores, hábitos, camino del plan y agenda por voz.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Derrotero · sistema visual de la marca personal de David Flórez Sierra (v1, ago 2026)
   Tablero técnico impreso en papel: la tinta hace el contraste, el naranja señala, el petróleo acompaña.
   Solo tema claro, por decisión de marca. */
:root {
  color-scheme: light;
  --papel: #FCF6EC;
  --papel-hondo: #F5EDE0;
  --filete: #E6DCCB;
  --reticula: rgba(230, 220, 203, .55);
  --tinta: #0C0F14;
  --tinta-media: #4A443C;
  --tinta-tenue: #6E675E;
  --gris-dato: #8C857A;
  --n-100: #FBE7D6; --n-200: #F6C8A4; --n-400: #F09C64; --n-500: #EA632B; --n-600: #C24C1C; --n-700: #8F3510;
  --p-100: #D5EAE7; --p-300: #8FC9C3; --p-400: #4FA79F; --p-600: #008C82; --p-700: #00655E; --p-800: #0E4F52; --p-900: #0A3B3E;
  --positivo: #2F6B3C; --positivo-fino: #1F5A2E; --positivo-100: #DDEBDD;
  --alerta: #7E560C; --alerta-100: #F5E6C6;
  --negativo: #A32E1E; --negativo-100: #F6DCD6;
  --serie-1: #EA632B; --serie-2: #008C82; --serie-3: #4B5FB0; --serie-4: #AE7A14;
  --tipo-titular: "Archivo", "Arial Black", Arial, sans-serif;
  --tipo-texto: "Archivo", Arial, sans-serif;
  --tipo-mono: "IBM Plex Mono", Consolas, "Courier New", monospace;
  --r: 8px;
  --side: 256px;
  --tab-h: 64px;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background-color: var(--papel);
  background-image:
    linear-gradient(var(--reticula) 1px, transparent 1px),
    linear-gradient(90deg, var(--reticula) 1px, transparent 1px);
  background-size: 32px 32px;
  color: var(--tinta);
  font: 400 16px/1.5 var(--tipo-texto);
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--n-700); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--n-500); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.mono { font-family: var(--tipo-mono); }
.num { font-variant-numeric: tabular-nums; }

/* ───── armazón ───── */
.app { display: grid; grid-template-columns: var(--side) minmax(0, 1fr); min-height: 100%; }
.side {
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
  background: var(--p-900); color: var(--papel);
  display: flex; flex-direction: column; gap: 24px;
  padding: calc(24px + env(safe-area-inset-top, 0px)) 16px 24px;
}
.brand { display: grid; gap: 6px; padding: 0 8px; }
.brand-name {
  font: 800 30px/1 var(--tipo-titular); font-stretch: 80%; letter-spacing: -.02em; text-transform: uppercase;
  padding-bottom: 8px; border-bottom: 3px solid var(--n-500); justify-self: start;
}
.brand-sub { font: 500 11px/1.4 var(--tipo-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--p-300); }
.nav { display: grid; gap: 20px; }
.nav-group { display: grid; gap: 2px; }
.nav-label { font: 500 10.5px/1 var(--tipo-mono); letter-spacing: .16em; text-transform: uppercase; color: var(--p-300); padding: 0 12px 8px; }
.nav a {
  display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 6px;
  color: #E4EFEC; text-decoration: none; font-weight: 500; font-size: 15px; position: relative;
}
.nav a svg { flex: none; width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: square; }
.nav a:hover { background: rgba(252, 246, 236, .07); color: var(--papel); }
.nav a[aria-current="page"] { background: var(--p-800); color: var(--papel); }
.nav a[aria-current="page"]::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px; background: var(--n-500); border-radius: 0 2px 2px 0; }
.nav .badge { margin-left: auto; font: 500 11px/1 var(--tipo-mono); padding: 4px 7px; border-radius: 99px; background: var(--n-500); color: var(--tinta); }
.nav .badge.soft { background: rgba(252, 246, 236, .12); color: var(--papel); }
.side-foot { margin-top: auto; padding: 12px; border: 1px solid rgba(143, 201, 195, .25); border-radius: var(--r); display: grid; gap: 4px; }
.side-foot .mono { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--p-300); }
.side-foot strong { font-weight: 600; font-size: 14px; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--p-400); margin-right: 6px; vertical-align: 1px; }
.dot.off { background: var(--n-400); }

.main-col { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: rgba(252, 246, 236, .94); backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--filete);
  display: flex; align-items: center; gap: 16px; padding: 12px 32px;
}
.topbar .m-brand { display: none; }
.capture-bar { flex: 1; display: flex; align-items: center; gap: 8px; max-width: 760px;
  background: #fff9f0; border: 1px solid var(--filete); border-radius: var(--r); padding: 4px 4px 4px 12px; }
.capture-bar:focus-within { border-color: var(--p-700); }
.capture-bar input { flex: 1; min-width: 0; border: 0; background: transparent; padding: 8px 0; outline: none; font-size: 15px; }
.capture-bar input::placeholder { color: var(--tinta-tenue); }
.today-stamp { font: 500 12px/1.3 var(--tipo-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--tinta-tenue); text-align: right; white-space: nowrap; }
.today-stamp b { display: block; color: var(--tinta); font-weight: 500; }

main { width: 100%; max-width: 1240px; margin: 0 auto; padding-inline: 32px; padding-block: 32px 96px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 32px; align-content: start; }

.banner { display: flex; gap: 12px; align-items: flex-start; padding: 12px 16px; border-radius: var(--r); border: 1px solid; font-size: 14px; }
.banner.warn { background: var(--alerta-100); border-color: #E5CD98; color: #4A3306; }
.banner.bad { background: var(--negativo-100); border-color: #E8B9AF; color: #5E1A10; }
.banner.info { background: var(--p-100); border-color: var(--p-300); color: var(--p-900); }
.banner.ok { background: var(--positivo-100); border-color: #B7D3B7; color: var(--positivo-fino); }

/* ───── tipografía de página ───── */
.kicker { font: 500 12px/1.3 var(--tipo-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--p-800); }
.kicker.tenue { color: var(--tinta-tenue); }
.page-head { display: grid; gap: 12px; }
.page-head h1 {
  font: 800 clamp(34px, 5.2vw, 60px)/.95 var(--tipo-titular); font-stretch: 80%; letter-spacing: -.02em; text-transform: uppercase;
}
.page-head h1 .senal { color: var(--n-500); }
.page-head .bajada { font: 500 clamp(17px, 1.6vw, 20px)/1.45 var(--tipo-texto); color: var(--p-800); max-width: 62ch; }
.page-head.row { grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: 16px 32px; }
h2.sec { font: 800 24px/1.05 var(--tipo-titular); font-stretch: 85%; letter-spacing: -.01em; text-transform: uppercase; }
h3.card-t { font: 700 17px/1.25 var(--tipo-texto); }
.sub { color: var(--p-800); font-size: 14.5px; }
.muted { color: var(--tinta-media); }
.tenue { color: var(--tinta-tenue); }
.sec-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 8px 16px; }
.sec-head .kicker { margin-bottom: 6px; }

/* ───── piezas ───── */
.card { background: var(--papel); border: 1px solid var(--filete); border-radius: var(--r); padding: 24px; display: grid; gap: 16px; align-content: start; min-width: 0; }
.card.hondo { background: var(--papel-hondo); }
.plano { position: relative; }
.plano::before, .plano::after { content: ""; position: absolute; width: 12px; height: 12px; pointer-events: none; }
.plano::before { top: -7px; left: -7px; border-left: 1px solid var(--tinta-tenue); border-top: 1px solid var(--tinta-tenue); }
.plano::after { bottom: -7px; right: -7px; border-right: 1px solid var(--tinta-tenue); border-bottom: 1px solid var(--tinta-tenue); }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.split { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 24px; align-items: start; }
.stack { display: grid; gap: 16px; align-content: start; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.row.between { justify-content: space-between; }
.hr { height: 1px; background: var(--filete); }

/* cifras tipo tablero */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--filete); border-radius: var(--r); background: var(--papel); }
.stat { padding: 20px 24px; display: grid; gap: 8px; align-content: start; border-left: 1px solid var(--filete); min-width: 0; }
.stat:first-child { border-left: 0; }
.stat .label { font: 400 12px/1.3 var(--tipo-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--tinta-tenue); }
.stat .fig { font: 700 44px/1 var(--tipo-texto); letter-spacing: -.01em; }
.stat .fig small { font-size: 20px; font-weight: 600; color: var(--tinta-media); margin-left: 2px; }
.stat .foot { font-size: 13.5px; color: var(--p-800); }
.stat.alarm .fig { color: var(--negativo); }
.bar { height: 6px; background: var(--papel-hondo); border: 1px solid var(--filete); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--n-500); border-radius: 99px; }
.bar.petrol > i { background: var(--p-600); }

/* botones */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 8px 16px; border-radius: 6px;
  border: 1px solid var(--tinta); background: var(--tinta); color: var(--papel); font-weight: 600; font-size: 14.5px; text-decoration: none; white-space: nowrap; }
.btn:hover { background: #22262e; }
.btn.alt { background: transparent; color: var(--tinta); border-color: var(--filete); }
.btn.alt:hover { border-color: var(--tinta-tenue); background: var(--papel-hondo); }
.btn.petrol { background: var(--p-800); border-color: var(--p-800); }
.btn.petrol:hover { background: var(--p-900); }
.btn.llama { background: var(--n-500); border-color: var(--n-500); color: var(--tinta); }
.btn.llama:hover { background: var(--n-400); }
.btn.danger { background: var(--negativo); border-color: var(--negativo); color: #fff; }
.btn.sm { min-height: 32px; padding: 4px 10px; font-size: 13.5px; }
.btn.icon { padding: 8px; min-width: 40px; }
.btn svg, .ic { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: square; flex: none; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.link { background: none; border: 0; padding: 0; color: var(--n-700); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
.mic { width: 40px; height: 40px; border-radius: 6px; border: 0; background: var(--n-500); color: var(--tinta); display: grid; place-items: center; flex: none; }
.mic:hover { background: var(--n-400); }
.mic.on { background: var(--negativo); color: #fff; animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(163, 46, 30, .18); } }

/* formularios */
.field { display: grid; gap: 6px; min-width: 0; }
.field > span, .flabel { font: 400 11.5px/1.2 var(--tipo-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--tinta-tenue); }
.in, select.in, textarea.in { width: 100%; min-height: 40px; padding: 8px 12px; border: 1px solid var(--filete); border-radius: 6px; background: #fff9f0; font-size: 15px; }
textarea.in { min-height: 88px; resize: vertical; line-height: 1.5; }
.in:focus { outline: none; border-color: var(--p-700); box-shadow: 0 0 0 3px rgba(0, 140, 130, .15); }
.in[disabled] { background: var(--papel-hondo); color: var(--tinta-media); }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; align-items: end; }
.check { display: inline-flex; align-items: center; gap: 8px; font-size: 14.5px; cursor: pointer; }
.check input { width: 18px; height: 18px; accent-color: var(--p-800); }
.hint { font-size: 13.5px; color: var(--tinta-media); }

/* chips, pestañas, segmentos */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--filete); background: var(--papel); border-radius: 99px; padding: 6px 12px; font-size: 13.5px; font-weight: 500; }
.chip:hover { border-color: var(--tinta-tenue); }
.chip[aria-pressed="true"] { background: var(--tinta); color: var(--papel); border-color: var(--tinta); }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--filete); overflow-x: auto; scrollbar-width: none; }
.tabs button { background: none; border: 0; padding: 10px 14px; font-weight: 600; font-size: 14.5px; color: var(--tinta-media); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--tinta); border-bottom-color: var(--n-500); }
.tabs .count { font: 500 11px/1 var(--tipo-mono); margin-left: 6px; padding: 3px 6px; border-radius: 99px; background: var(--papel-hondo); border: 1px solid var(--filete); }
.seg { display: inline-flex; border: 1px solid var(--filete); border-radius: 6px; overflow: hidden; background: var(--papel); }
.seg button { border: 0; border-left: 1px solid var(--filete); background: none; padding: 7px 12px; font-size: 13.5px; font-weight: 600; min-height: 36px; }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"].si { background: var(--positivo-100); color: var(--positivo-fino); }
.seg button[aria-pressed="true"].parcial { background: var(--alerta-100); color: var(--alerta); }
.seg button[aria-pressed="true"].no { background: var(--negativo-100); color: var(--negativo); }
.seg button[aria-pressed="true"].neutral { background: var(--tinta); color: var(--papel); }

/* estados */
.pill { display: inline-flex; align-items: center; gap: 6px; font: 500 11.5px/1 var(--tipo-mono); letter-spacing: .06em; text-transform: uppercase; padding: 5px 8px; border-radius: 4px; border: 1px solid var(--filete); color: var(--tinta-media); background: var(--papel); white-space: nowrap; }
.pill.curso, .pill.recordar { background: var(--p-100); border-color: var(--p-300); color: var(--p-900); }
.pill.hecha { background: var(--positivo-100); border-color: #B7D3B7; color: var(--positivo-fino); }
.pill.bloqueada, .pill.vencida { background: var(--negativo-100); border-color: #E8B9AF; color: var(--negativo); }
.pill.warn { background: var(--alerta-100); border-color: #E5CD98; color: var(--alerta); }
.pill.llama { background: var(--n-100); border-color: var(--n-200); color: var(--n-700); }
.front-tag { font: 500 11px/1 var(--tipo-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--p-800); white-space: nowrap; }
.st-btn { width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--tinta-tenue); background: var(--papel); display: grid; place-items: center; padding: 0; flex: none; }
.st-btn svg { width: 14px; height: 14px; stroke-width: 2; stroke: currentColor; fill: none; }
.st-btn.curso { border-color: var(--p-700); background: conic-gradient(var(--p-600) 0 50%, var(--papel) 0); }
.st-btn.hecha { border-color: var(--positivo); background: var(--positivo); color: #fff; }
.st-btn.bloqueada { border-color: var(--negativo); background: var(--negativo-100); color: var(--negativo); }

/* listas de actividades */
.phase { border: 1px solid var(--filete); border-radius: var(--r); background: var(--papel); overflow: hidden; }
.phase-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 16px; align-items: center; padding: 16px 20px; background: var(--papel-hondo); border-bottom: 1px solid var(--filete); }
.phase-head h3 { font: 800 18px/1.1 var(--tipo-titular); font-stretch: 85%; text-transform: uppercase; }
.phase-head .bar { width: 140px; }
.trow { display: grid; grid-template-columns: 20px 28px minmax(0, 1fr) 130px 150px 120px; gap: 12px; align-items: center; padding: 12px 20px; border-top: 1px solid var(--filete); }
.trow:first-of-type { border-top: 0; }
.trow.overdue { background: linear-gradient(90deg, var(--negativo-100), transparent 40%); }
.trow.drag-over { box-shadow: inset 0 2px 0 var(--n-500); }
.trow .handle { cursor: grab; color: var(--gris-dato); display: grid; place-items: center; }
.trow .title-btn { text-align: left; background: none; border: 0; padding: 0; font-size: 15.5px; font-weight: 500; line-height: 1.35; }
.trow .title-btn:hover { color: var(--p-800); }
.trow.done .title-btn { color: var(--tinta-tenue); text-decoration: line-through; text-decoration-color: var(--gris-dato); }
.trow .owner { font-size: 13.5px; color: var(--tinta-media); }
.trow .due { font: 500 13px/1.2 var(--tipo-mono); text-align: right; }
.trow .due.bad, .trow .meta-m .bad { color: var(--negativo); }
.trow .meta-m { display: none; flex-wrap: wrap; gap: 4px 12px; margin-top: 6px; font: 500 12px/1.2 var(--tipo-mono); color: var(--tinta-media); }
.tdetail { grid-column: 1 / -1; display: grid; gap: 16px; padding: 16px; margin-top: 4px; background: var(--papel-hondo); border: 1px solid var(--filete); border-radius: var(--r); }
.inline-confirm { grid-column: 1 / -1; display: grid; gap: 12px; padding: 16px; border-radius: var(--r); background: var(--negativo-100); border: 1px solid #E8B9AF; }

/* puntos de control */
.verdict { display: grid; gap: 4px; padding: 16px; border-radius: var(--r); border: 1px solid var(--filete); background: var(--papel-hondo); }
.verdict strong { font: 800 22px/1.1 var(--tipo-titular); font-stretch: 85%; text-transform: uppercase; }
.verdict.ok { background: var(--positivo-100); border-color: #B7D3B7; color: var(--positivo-fino); }
.verdict.partial { background: var(--alerta-100); border-color: #E5CD98; color: var(--alerta); }
.verdict.bad { background: var(--negativo-100); border-color: #E8B9AF; color: var(--negativo); }
.crit { display: grid; gap: 10px; padding: 16px 0; border-top: 1px solid var(--filete); }
.cp-mini { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--filete); }
.cp-mini:first-of-type { border-top: 0; }

/* indicadores */
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.kpi { background: var(--papel); border: 1px solid var(--filete); border-radius: var(--r); padding: 20px; display: grid; gap: 12px; align-content: start; min-width: 0; }
.kpi .label { font-weight: 600; font-size: 15px; line-height: 1.3; min-height: 2.6em; }
.kpi .val { display: flex; align-items: baseline; gap: 8px; }
.kpi .val b { font: 700 48px/1 var(--tipo-texto); letter-spacing: -.01em; }
.kpi .val span { font: 500 13px/1.2 var(--tipo-mono); color: var(--tinta-tenue); }
.kpi .meta { font-size: 13.5px; color: var(--p-800); }
.kpi .ctrl { display: flex; gap: 8px; }
.kpi .ctrl .btn { flex: 1; font-size: 20px; line-height: 1; }
.kpi svg.chart { width: 100%; height: auto; display: block; }
.kpi-mini { display: grid; gap: 6px; }
.kpi-mini .row { justify-content: space-between; font-size: 14px; }
.chart text { font-family: var(--tipo-mono); font-size: 10px; fill: var(--tinta-tenue); }
.chart .endlabel { font-size: 11px; font-weight: 500; fill: var(--tinta); }

/* agenda */
.capture { display: grid; gap: 16px; padding: 24px; border-radius: var(--r); background: var(--p-900); color: var(--papel); }
.capture .kicker { color: var(--p-300); }
.capture h2 { font: 800 clamp(26px, 3.4vw, 38px)/1 var(--tipo-titular); font-stretch: 80%; text-transform: uppercase; letter-spacing: -.01em; }
.capture h2 .senal { color: var(--n-400); }
.capture-input { display: flex; gap: 8px; align-items: stretch; background: var(--papel); border-radius: var(--r); padding: 6px; }
.capture-input textarea { flex: 1; min-width: 0; border: 0; background: transparent; resize: none; padding: 8px 10px; font-size: 17px; line-height: 1.4; color: var(--tinta); outline: none; min-height: 48px; }
.capture-input .mic { width: 48px; height: auto; min-height: 48px; }
.capture .hint { color: #CFE3DF; }
.capture .chips .chip { background: transparent; color: var(--papel); border-color: rgba(143, 201, 195, .4); font-size: 13px; text-align: left; }
.capture .chips .chip:hover { border-color: var(--p-300); background: rgba(252, 246, 236, .06); }
.draft { background: var(--papel); color: var(--tinta); border-radius: var(--r); padding: 20px; display: grid; gap: 16px; }
.draft .assume { display: grid; gap: 4px; font-size: 13.5px; color: var(--alerta); }
.ag-day { display: grid; gap: 0; border: 1px solid var(--filete); border-radius: var(--r); background: var(--papel); overflow: hidden; }
.ag-day-h { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; padding: 12px 20px; background: var(--papel-hondo); border-bottom: 1px solid var(--filete); }
.ag-day-h h3 { font: 800 16px/1.1 var(--tipo-titular); font-stretch: 85%; text-transform: uppercase; }
.ag-day-h.bad { background: var(--negativo-100); }
.ag-day-h.bad h3 { color: var(--negativo); }
.aitem { display: grid; grid-template-columns: 88px minmax(0, 1fr) auto; gap: 12px 16px; align-items: center; padding: 14px 20px; border-top: 1px solid var(--filete); }
.aitem:first-of-type { border-top: 0; }
.aitem .when { font: 500 14px/1.2 var(--tipo-mono); }
.aitem .when small { display: block; font-size: 11px; color: var(--tinta-tenue); margin-top: 3px; }
.aitem .what { display: grid; gap: 4px; min-width: 0; }
.aitem .what b { font-weight: 600; font-size: 15.5px; line-height: 1.35; overflow-wrap: anywhere; }
.aitem .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.aitem.done .what b { text-decoration: line-through; color: var(--tinta-tenue); }
.aitem.task-due { background: repeating-linear-gradient(135deg, transparent 0 8px, rgba(230, 220, 203, .35) 8px 9px); }
.aitem .more { grid-column: 1 / -1; display: grid; gap: 12px; padding: 16px; background: var(--papel-hondo); border: 1px solid var(--filete); border-radius: var(--r); }
.month { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border: 1px solid var(--filete); border-radius: var(--r); overflow: hidden; background: var(--papel); }
.month .dow { font: 500 11px/1 var(--tipo-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--tinta-tenue); padding: 10px 8px; background: var(--papel-hondo); border-bottom: 1px solid var(--filete); }
.month .cell { min-height: 92px; padding: 8px; border-left: 1px solid var(--filete); border-top: 1px solid var(--filete); background: none; border-right: 0; border-bottom: 0; text-align: left; display: grid; align-content: start; gap: 4px; font-size: 12px; }
.month .cell:nth-child(7n + 1) { border-left: 0; }
.month .cell.out { color: var(--gris-dato); background: rgba(245, 237, 224, .5); }
.month .cell .d { font: 500 13px/1 var(--tipo-mono); }
.month .cell.today .d { background: var(--n-500); color: var(--tinta); border-radius: 4px; padding: 3px 5px; justify-self: start; }
.month .cell[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--p-700); }
.month .ev { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 2px 5px; border-radius: 3px; background: var(--p-100); color: var(--p-900); font-size: 11.5px; }
.month .ev.task { background: var(--papel-hondo); color: var(--tinta-media); border: 1px dashed var(--filete); }
.month .ev.bad { background: var(--negativo-100); color: var(--negativo); }
.month .ev.done { text-decoration: line-through; opacity: .7; }
.month .dots { display: none; gap: 3px; }
.month .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--p-600); }
.month .dots i.task { background: var(--gris-dato); }
.month .dots i.bad { background: var(--negativo); }

/* hábitos */
.habit { display: grid; gap: 12px; }
.habit-top { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: start; }
.ticks { display: flex; gap: 4px; flex-wrap: wrap; }
.ticks i { width: 18px; height: 18px; border-radius: 3px; background: var(--papel-hondo); border: 1px solid var(--filete); }
.ticks i.on { background: var(--p-600); border-color: var(--p-600); }
.ticks i.off { opacity: .35; }
.ticks i.today { outline: 2px solid var(--n-500); outline-offset: 1px; }
.streak { font: 700 28px/1 var(--tipo-texto); }
.streak small { font: 400 11px/1 var(--tipo-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--tinta-tenue); display: block; margin-top: 4px; }

/* semana tipo */
.week-wrap { overflow-x: auto; border: 1px solid var(--filete); border-radius: var(--r); background: var(--papel); }
.week { display: grid; grid-template-columns: 56px repeat(7, minmax(110px, 1fr)); min-width: 860px; position: relative; }
.week .wh { font: 500 11px/1 var(--tipo-mono); letter-spacing: .12em; text-transform: uppercase; padding: 12px 8px; border-bottom: 1px solid var(--filete); background: var(--papel-hondo); border-left: 1px solid var(--filete); }
.week .col { position: relative; border-left: 1px solid var(--filete); }
.week .hours { position: relative; }
.week .hl { position: absolute; left: 0; right: 0; border-top: 1px solid var(--filete); }
.week .hlabel { position: absolute; right: 6px; font: 400 10.5px/1 var(--tipo-mono); color: var(--tinta-tenue); transform: translateY(-50%); }
.blk { position: absolute; left: 3px; right: 3px; border-radius: 4px; padding: 4px 6px; font-size: 12px; line-height: 1.25; overflow: hidden; text-align: left; border: 0; border-left: 3px solid; }
.blk b { display: block; font-weight: 600; }
.blk span { font: 400 10.5px/1.2 var(--tipo-mono); opacity: .85; }
.blk.personal { background: var(--n-100); border-color: var(--n-500); color: var(--n-700); }
.blk.ikm { background: var(--p-100); border-color: var(--p-600); color: var(--p-900); }
.blk.salud { background: #E3E6F4; border-color: var(--serie-3); color: #2C3872; }
.blk.familia { background: #F3E8CF; border-color: var(--serie-4); color: #5B3F07; }
.blk.libre, .blk.creativo { background: var(--papel-hondo); border-color: var(--gris-dato); color: var(--tinta-media); }
.legend { display: flex; flex-wrap: wrap; gap: 12px 20px; font-size: 13.5px; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; border-left: 3px solid; }

/* tablas */
.table-wrap { overflow-x: auto; border: 1px solid var(--filete); border-radius: var(--r); background: var(--papel); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font: 500 11px/1.2 var(--tipo-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--tinta-tenue); padding: 10px 14px; background: var(--papel-hondo); border-bottom: 1px solid var(--filete); white-space: nowrap; }
td { padding: 10px 14px; border-top: 1px solid var(--filete); vertical-align: top; }
tr:first-child td { border-top: 0; }
td.mono { font-size: 12.5px; white-space: nowrap; }
.diff { display: grid; gap: 2px; }
.diff del { color: var(--negativo); text-decoration-color: rgba(163, 46, 30, .5); }
.diff ins { color: var(--positivo-fino); text-decoration: none; }

pre.summary { margin: 0; white-space: pre-wrap; font: 400 14px/1.6 var(--tipo-mono); background: var(--papel); border: 1px solid var(--filete); border-radius: var(--r); padding: 24px; overflow-x: auto; }

.empty { padding: 24px; text-align: center; color: var(--tinta-media); font-size: 14.5px; }
.list-plain { display: grid; gap: 0; }
.li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--filete); font-size: 14.5px; }
.li:first-child { border-top: 0; }
.li .d { font: 500 12.5px/1.2 var(--tipo-mono); color: var(--tinta-media); white-space: nowrap; }
.li .d.bad { color: var(--negativo); }

/* avisos */
.toasts { position: fixed; right: 24px; bottom: 24px; z-index: 60; display: grid; gap: 10px; width: min(400px, calc(100vw - 32px)); }
.toast { background: var(--tinta); color: var(--papel); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 10px; animation: rise .22s ease-out; }
.toast.remind { background: var(--p-900); border-left: 4px solid var(--n-500); }
.toast.bad { background: #3A140D; border-left: 4px solid var(--negativo); }
.toast .kicker { color: var(--n-200); }
.toast b { font-weight: 600; }
.toast .row .btn.alt { color: var(--papel); border-color: rgba(252, 246, 236, .3); }
.toast .row .btn.alt:hover { background: rgba(252, 246, 236, .08); }
@keyframes rise { from { transform: translateY(8px); opacity: 0; } }

/* móvil */
.tabbar { display: none; }
.sheet-bg { position: fixed; inset: 0; background: rgba(12, 15, 20, .4); z-index: 70; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 71; background: var(--papel); border-radius: 12px 12px 0 0; padding: 20px 16px calc(20px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 12px; max-height: 80vh; overflow-y: auto; }
.sheet .nav a { color: var(--tinta); }
.sheet .nav a:hover { background: var(--papel-hondo); color: var(--tinta); }
.sheet .nav-label { color: var(--tinta-tenue); }
.sheet .nav a[aria-current="page"] { background: var(--p-100); color: var(--p-900); }
.fab { display: none; }

@media (max-width: 1180px) {
  .split { grid-template-columns: minmax(0, 1fr); }
  .trow { grid-template-columns: 20px 28px minmax(0, 1fr) 110px 110px; }
  .trow .owner { display: none; }
}
@media (max-width: 980px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }
  .topbar { padding: 10px 16px; gap: 10px; }
  .topbar .m-brand { display: block; font: 800 20px/1 var(--tipo-titular); font-stretch: 80%; text-transform: uppercase; padding-bottom: 4px; border-bottom: 3px solid var(--n-500); }
  .topbar .capture-bar { display: none; }
  .topbar .today-stamp { margin-left: auto; }
  main { padding-inline: 16px; padding-block: 24px calc(var(--tab-h) + 96px); gap: 24px; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stat:nth-child(3) { border-left: 0; }
  .stat:nth-child(n + 3) { border-top: 1px solid var(--filete); }
  .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .tabbar { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
    background: var(--p-900); padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px)); }
  .tabbar a, .tabbar button { display: grid; justify-items: center; gap: 4px; padding: 6px 2px; color: #CFE3DF; text-decoration: none; font-size: 11.5px; font-weight: 500; background: none; border: 0; position: relative; }
  .tabbar svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: square; }
  .tabbar [aria-current="page"] { color: var(--papel); }
  .tabbar [aria-current="page"]::after { content: ""; position: absolute; top: -6px; left: 30%; right: 30%; height: 3px; background: var(--n-500); border-radius: 0 0 2px 2px; }
  .tabbar .badge { position: absolute; top: 0; right: calc(50% - 22px); font: 500 10px/1 var(--tipo-mono); padding: 3px 5px; border-radius: 99px; background: var(--n-500); color: var(--tinta); }
  .fab { display: grid; place-items: center; position: fixed; right: 16px; bottom: calc(var(--tab-h) + 16px + env(safe-area-inset-bottom, 0px)); z-index: 51;
    width: 56px; height: 56px; border-radius: 50%; border: 0; background: var(--n-500); color: var(--tinta); }
  .fab svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.75; }
  .toasts { right: 16px; bottom: calc(var(--tab-h) + 88px); }
}
@media (max-width: 760px) {
  .g2, .g3 { grid-template-columns: minmax(0, 1fr); }
  .page-head.row { grid-template-columns: minmax(0, 1fr); }
  .card { padding: 18px; }
  .trow { grid-template-columns: 28px minmax(0, 1fr); padding: 12px 14px; gap: 6px 12px; }
  .trow > .handle, .trow > .front-tag, .trow > .owner, .trow > .due { display: none; }
  .trow .meta-m { display: flex; }
  .phase-head { padding: 14px; grid-template-columns: minmax(0, 1fr); }
  .phase-head .bar { width: 100%; }
  .aitem { grid-template-columns: 64px minmax(0, 1fr); padding: 12px 14px; }
  .aitem .acts { grid-column: 1 / -1; justify-content: flex-start; }
  .ag-day-h { padding: 12px 14px; }
  .month .cell { min-height: 56px; padding: 6px 4px; }
  .month .ev { display: none; }
  .month .dots { display: flex; flex-wrap: wrap; }
  .capture { padding: 18px; }
}
@media (max-width: 480px) {
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .kpi { padding: 14px; }
  .kpi .val b { font-size: 36px; }
  .stat { padding: 16px; }
  .stat .fig { font-size: 34px; }
  .today-stamp { font-size: 10.5px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* los contenedores en rejilla nunca crecen más que su carril */
.card, .stack, .capture, .draft, .tdetail, .aitem .more, .habit, .verdict, .crit, .inline-confirm, .page-head, .kpi, .kpi-mini { grid-template-columns: minmax(0, 1fr); }
.page-head.row { grid-template-columns: minmax(0, 1fr) auto; }
@media (max-width: 760px) { .page-head.row { grid-template-columns: minmax(0, 1fr); } .capture-input .btn { padding-inline: 12px; } }
.app { background: linear-gradient(90deg, var(--p-900) var(--side), transparent var(--side)); }
@media (max-width: 980px) {
  .app { background: none; }
  .toast { padding: 12px; gap: 6px; font-size: 14px; }
  .toast .btn.sm { min-height: 30px; padding: 3px 9px; }
}

/* ───── Hoy: camino del plan e indicadores gráficos ───── */
.dash-head h1 { font-size: clamp(34px, 5vw, 56px); }
.road-card { padding: 16px 16px 14px; gap: 10px; overflow: hidden; }
.road-svg { display: block; width: 100%; height: auto; }
.road-svg.vertical { max-width: 520px; margin-inline: auto; }
.road-svg text { font-family: var(--tipo-mono); }
.rd-month { font-size: 10.5px; letter-spacing: .12em; fill: var(--tinta-tenue); }
.rd-month.strong { fill: var(--tinta); font-weight: 500; }
.rd-num { font: 600 10px/1 var(--tipo-mono); fill: var(--tinta); pointer-events: none; }
.rd-num.light { fill: var(--papel); }
.rd-hit { cursor: pointer; outline: none; }
.rd-flag { pointer-events: none; }
.rd-hit:hover > :not([stroke="transparent"]), .rd-hit:focus-visible > :not([stroke="transparent"]) { filter: drop-shadow(0 0 2px rgba(12, 15, 20, .45)); }
.walker-tag text { font-size: 9.5px; letter-spacing: .1em; fill: var(--papel); font-weight: 500; }
.walker .leg, .walker .arm { transform-box: fill-box; transform-origin: 50% 0; }
.walker .leg.a, .walker .arm.b { transform: rotate(14deg); }
.walker .leg.b, .walker .arm.a { transform: rotate(-14deg); }
.walker.walking .leg.a, .walker.walking .arm.b { animation: swing .42s ease-in-out infinite alternate; }
.walker.walking .leg.b, .walker.walking .arm.a { animation: swing .42s ease-in-out infinite alternate-reverse; }
.walker.walking .body { animation: bob .21s ease-in-out infinite alternate; }
.walker .balloon { animation: float 3.2s ease-in-out infinite alternate; cursor: help; }
@keyframes swing { from { transform: rotate(-26deg); } to { transform: rotate(26deg); } }
@keyframes bob { from { transform: translateY(0); } to { transform: translateY(-1.5px); } }
@keyframes float { from { transform: translateY(0); } to { transform: translateY(-5px); } }
.rd-legend { display: flex; flex-wrap: wrap; gap: 8px 20px; padding: 10px 6px 0; border-top: 1px solid var(--filete); font-size: 13.5px; color: var(--tinta-media); }
.rd-legend span { display: inline-flex; align-items: center; gap: 6px; }
.rd-legend svg { width: 18px; height: 18px; flex: none; }
.rd-legend b { color: var(--tinta); font-variant-numeric: tabular-nums; }
.rd-legend small { font: 400 11px/1 var(--tipo-mono); color: var(--tinta-tenue); }

.dash { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.tile { background: var(--papel); border: 1px solid var(--filete); border-radius: var(--r); padding: 18px; display: grid; gap: 14px; align-content: start; min-width: 0; grid-template-columns: minmax(0, 1fr); }
.tile.w2 { grid-column: span 2; }
.tile-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.tile-h .kicker { color: var(--tinta-media); }
.tile svg { display: block; width: 100%; height: auto; overflow: visible; }
.tile svg text { font-family: var(--tipo-mono); }
.tile svg .axis { font-size: 10px; fill: var(--tinta-tenue); letter-spacing: .06em; }
.tile svg .axis.strong { fill: var(--tinta); font-weight: 500; }
.tile svg .big { font: 700 34px/1 var(--tipo-texto); fill: var(--tinta); }
.tile svg .big .unit { font-size: 17px; font-weight: 600; fill: var(--tinta-media); }
.tile svg .cap { font-size: 9.5px; letter-spacing: .14em; fill: var(--tinta-tenue); }
.tile [data-tip] { cursor: default; }
.tile a[data-tip], .tile button[data-tip] { cursor: pointer; }
.tile .btn svg, .tile .link svg { width: 18px; height: 18px; flex: none; }
.tile { container-type: inline-size; }
@container (max-width: 330px) {
  .ring-row { grid-template-columns: minmax(0, 1fr); justify-items: center; gap: 10px; }
  .ring-lg { max-width: 124px; }
  .ring-leg { grid-template-columns: repeat(2, max-content); justify-content: center; gap: 8px 16px; }
  .ring-leg .pace { grid-column: 1 / -1; justify-self: center; }
}
.tile-note { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--tinta-tenue); }
.tile-note svg { width: 12px; height: 12px; flex: none; }

.ring-row { display: grid; grid-template-columns: 136px minmax(0, 1fr); gap: 14px; align-items: center; }
.ring-lg { max-width: 136px; }
.ring-leg { display: grid; gap: 10px; font-size: 13.5px; color: var(--tinta-media); }
.ring-leg span { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.ring-leg b { color: var(--tinta); font-size: 16px; }
.ring-leg i, .st-leg i, .mini-leg i { width: 10px; height: 10px; border-radius: 3px; flex: none; display: inline-block; }
.pace { display: inline-flex !important; align-items: center; flex-wrap: wrap; gap: 5px; font: 500 11px/1 var(--tipo-mono); letter-spacing: .06em; text-transform: uppercase; padding: 5px 8px; border-radius: 4px; border: 1px solid; max-width: 100%; }
.pace svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.pace.ok { background: var(--positivo-100); border-color: #B7D3B7; color: var(--positivo-fino); }
.pace.warn { background: var(--alerta-100); border-color: #E5CD98; color: var(--alerta); }

.stackbar { border-radius: 4px; height: 22px; }
.st-leg { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 12px; font-size: 13px; color: var(--tinta-media); }
.st-leg span { display: flex; align-items: center; gap: 6px; }
.st-leg b { color: var(--tinta); font-size: 16px; min-width: 2ch; }
.st-leg .zero { opacity: .45; }
.mini-leg { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--tinta-media); }
.mini-leg span { display: inline-flex; align-items: center; gap: 6px; }

.gauges { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px 12px; }
.gauge { display: grid; justify-items: center; gap: 6px; text-decoration: none; color: inherit; padding: 6px 4px 8px; border-radius: 6px; text-align: center; }
.gauge:hover { background: var(--papel-hondo); }
.gauge svg { max-width: 150px; }
.gauge .g-label { font-size: 12.5px; line-height: 1.3; color: var(--tinta-media); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.6em; }

.fbars { display: grid; gap: 12px; }
.fbar { display: grid; grid-template-columns: 118px minmax(0, 1fr) 44px; gap: 12px; align-items: center; font-size: 14px; }
.f-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.f-track { position: relative; height: 12px; background: var(--filete); border-radius: 4px; overflow: hidden; display: block; }
.f-track i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--p-600); border-radius: 4px; }
.f-track em { position: absolute; right: 0; top: 0; bottom: 0; background: var(--negativo); border-left: 2px solid var(--papel); border-radius: 0 4px 4px 0; }
.f-num { font: 500 13px/1 var(--tipo-mono); text-align: right; color: var(--tinta-media); }

.hrings { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.hring { display: grid; justify-items: center; gap: 4px; background: none; border: 1px solid transparent; border-radius: 8px; padding: 8px 4px; position: relative; }
.hring:hover { background: var(--papel-hondo); }

  function countdown(a, now) {
    var tm = DL.agendaTimes(a); var st = DL.agendaState(a, now);
    function span(ms) {
      var m = Math.round(Math.abs(ms) / 60000);
      if (m < 60) return m + ' min';
      var h = Math.round(m / 60); if (h < 36) return h + ' h';
      return Math.round(h / 24) + ' días';
    }
    if (st === 'hecha') return 'hecha';
    if (st === 'vencida') return 'venció hace ' + span(now - tm.end);
    if (st === 'en curso') return tm.timed ? 'en curso · termina ' + DL.fmtTime(DL.nowTimeBogota(tm.end)) : 'vence hoy a medianoche';
    if (st === 'por recordar') return 'empieza en ' + span(tm.start - now);
    return 'en ' + span(tm.start - now);
  }
  function calItem(e, opts) {

      '<div class="what"><b>' + esc(e.title) + '</b><div class="row"><span class="cal-tag">Calendario</span>' + (e.time && e.endTime ? '<span class="mono tenue" style="font-size:12px">hasta ' + DL.fmtTime(e.endTime) + '</span>' : '') + '</div></div><div class="acts"></div></div>';
  }
  var AG_PILL = { 'programada': '', 'por recordar': 'recordar', 'en curso': 'curso', 'vencida': 'vencida', 'hecha': 'hecha' };

  function aItem(a, opts) {
    var now = Date.now(); var st = DL.agendaState(a, now); var open = U.agOpen[a.id];
    var remTxt = a.time ? (a.remindMin ? 'aviso ' + (a.remindMin >= 60 ? (a.remindMin / 60) + ' h' : a.remindMin + ' min') + ' antes' : 'sin aviso previo') : 'aviso a las 8:00 a. m.';

      '<div class="when">' + (a.time ? DL.fmtTime(a.time) : 'Todo el día') + (opts && opts.showDate ? '<small>' + DL.fmtDate(a.date, { weekday: true, year: false }) + '</small>' : '') + '</div>' +
      '<div class="what"><b>' + esc(a.title) + '</b><div class="row">' + pill(st, AG_PILL[st]) +

  function captureHtml() {

  function vAgenda() {
    var td = today(); var now = Date.now();
    var items = DL.sortAgenda(DS.agenda());
    var venc = items.filter(function (a) { return DL.agendaState(a, now) === 'vencida'; });
    var open = items.filter(function (a) { return !a.done && DL.agendaState(a, now) !== 'vencida'; });
    var done = items.filter(function (a) { return a.done; }).reverse().slice(0, 20);
    var h = '<header class="page-head row"><div class="stack" style="gap:12px"><p class="kicker">Agenda · recordatorios · vencimientos</p><h1>Tu <span class="senal">agenda</span></h1>' +
      '<p class="bajada">Lo que dictas queda en el calendario, te avisa antes de empezar y se marca vencido si pasa sin hacerse.</p></div>' +
      '<div class="row">' + notifControl() + '</div></header>';
    h += captureHtml();
    h += '<div class="tabs" role="tablist">' +
      '<button role="tab" data-act="ag-view" data-v="lista" aria-selected="' + (U.agView === 'lista') + '">Lista<span class="count">' + open.length + '</span></button>' +
      '<button role="tab" data-act="ag-view" data-v="mes" aria-selected="' + (U.agView === 'mes') + '">Mes</button>' +
      '<button role="tab" data-act="ag-view" data-v="vencidas" aria-selected="' + (U.agView === 'vencidas') + '">Vencidas<span class="count">' + venc.length + '</span></button></div>';
    if (U.agView === 'mes') h += monthHtml(td);
    else if (U.agView === 'vencidas') {
      h += venc.length ? '<div class="ag-day"><div class="ag-day-h bad"><h3>Vencidas sin hacer</h3><span class="mono tenue">' + venc.length + '</span></div>' + venc.map(function (a) { return aItem(a, { showDate: true }); }).join('') + '</div>'
        : '<p class="empty">Nada vencido. Todo lo que pasó quedó hecho.</p>';
    } else {
      if (venc.length) h += '<div class="banner bad">' + venc.length + (venc.length === 1 ? ' actividad venció' : ' actividades vencieron') + ' sin marcarse como hechas. <button class="link" data-act="ag-view" data-v="vencidas">Revisarlas</button></div>';
      var groups = {};
      open.forEach(function (a) { (groups[a.date] = groups[a.date] || []).push({ a: a, k: a.time || '00:00' }); });
      var horizon = DL.addDays(td, 14);
      DS.calendar().forEach(function (e) { if (e.date >= td && e.date <= horizon) (groups[e.date] = groups[e.date] || []).push({ c: e, k: e.time || '00:00' }); });
      var days = Object.keys(groups).sort();
      h += days.length ? days.map(function (d) {
        var items = groups[d].sort(function (x, z) { return x.k.localeCompare(z.k); });
        return '<div class="ag-day"><div class="ag-day-h"><h3>' + esc(cap(DL.relDay(d, td))) + '</h3><span class="mono tenue">' + DL.fmtDate(d, { weekday: true }) + '</span></div>' + items.map(function (x) { return x.a ? aItem(x.a) : calItem(x.c); }).join('') + '</div>';
      }).join('') : '<p class="empty">No hay nada pendiente en la agenda. Dicta la próxima actividad arriba.</p>';
      if (S.cal.status === 'ok') h += '<p class="hint">Los eventos de tu calendario aparecen hasta 14 días adelante; en la vista Mes, todos. Se editan en tu calendario.</p>';
      if (done.length) {
        h += '<div><button class="link" data-act="toggle-done">' + (U.showDone ? 'Ocultar' : 'Ver') + ' las ' + done.length + ' últimas hechas</button></div>';
        if (U.showDone) h += '<div class="ag-day">' + done.map(function (a) { return aItem(a, { showDate: true }); }).join('') + '</div>';
      }
    }
    h += '<section class="card hondo"><div class="sec-head"><div><p class="kicker">Recordatorios fuera de la app</p><h2 class="sec">Llévala a tu calendario</h2></div></div>' +
      '<p class="muted">Con la app abierta, Derrotero te avisa en pantalla. Para que el celular te recuerde aunque la app esté cerrada, exporta la agenda: cada actividad lleva su alarma. Abre el .zip y toca el archivo .ics, o usa el botón de Google Calendar u Outlook de cada actividad.</p>' +
      '<div class="row"><button class="btn petrol" data-act="ag-export">' + ic('download') + 'Exportar agenda (.ics con alarmas)</button><button class="btn alt" data-act="ag-copy-ics">' + ic('copy') + 'Copiar .ics</button></div>' +
      (U.exportMsg ? '<p class="hint" aria-live="polite">' + esc(U.exportMsg) + '</p>' : '') + '</section>';
    return h;

  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  function monthHtml(td) {
    var base = U.agMonth || td.slice(0, 7);
    var y = +base.slice(0, 4), m = +base.slice(5, 7);
    var first = base + '-01'; var last = base + '-' + DL.pad(DL.lastDayOfMonth(y, m));
    var start = DL.mondayOf(first); var end = DL.addDays(DL.mondayOf(last), 6);
    var now = Date.now();
    var byDay = {};
    DS.agenda().forEach(function (a) { (byDay[a.date] = byDay[a.date] || []).push({ a: a }); });
    DS.tasks().forEach(function (t) { if (t.due && t.status !== 'hecha') (byDay[t.due] = byDay[t.due] || []).push({ t: t }); });
    DS.calendar().forEach(function (e) { if (e.date >= start && e.date <= end) (byDay[e.date] = byDay[e.date] || []).push({ c: e }); });
    var selDay = U.agDay || td;
    var h = '<div class="row between"><div class="row"><button class="btn alt sm" data-act="month" data-d="-1" aria-label="Mes anterior">‹</button><h2 class="sec" style="min-width:12ch;text-align:center">' + DL.MESES[m - 1] + ' ' + y + '</h2><button class="btn alt sm" data-act="month" data-d="1" aria-label="Mes siguiente">›</button></div><button class="btn alt sm" data-act="month" data-d="0">Hoy</button></div>';
    h += '<div class="month" role="grid">' + ['lun', 'mar', 'mié', 'jue', 'vie', 'sáb', 'dom'].map(function (d) { return '<div class="dow">' + d + '</div>'; }).join('');
    for (var d = start; d <= end; d = DL.addDays(d, 1)) {
      var evs = (byDay[d] || []);
      evs.sort(function (x, z) { var kx = x.a ? (x.a.time || '00') : x.c ? (x.c.time || '00') : '99', kz = z.a ? (z.a.time || '00') : z.c ? (z.c.time || '00') : '99'; return kx.localeCompare(kz); });
      h += '<button class="cell' + (d.slice(0, 7) !== base ? ' out' : '') + (d === td ? ' today' : '') + '" data-act="day" data-d="' + d + '"' + pressed(d === selDay) + ' aria-label="' + DL.fmtDateLong(d) + ', ' + evs.length + ' elementos"><span class="d">' + (+d.slice(8)) + '</span>' +
        evs.slice(0, 3).map(function (e) {
          if (e.a) { var st = DL.agendaState(e.a, now); return '<span class="ev' + (st === 'vencida' ? ' bad' : '') + (e.a.done ? ' done' : '') + '">' + (e.a.time ? e.a.time + ' ' : '') + esc(e.a.title) + '</span>'; }
          if (e.c) return '<span class="ev cal">' + (e.c.time ? e.c.time + ' ' : '') + esc(e.c.title) + '</span>';
          return '<span class="ev task' + (DL.isOverdue(e.t, td) ? ' bad' : '') + '">' + esc(e.t.title) + '</span>';
        }).join('') + (evs.length > 3 ? '<span class="mono tenue" style="font-size:11px">+' + (evs.length - 3) + ' más</span>' : '') +
        '<span class="dots">' + evs.slice(0, 5).map(function (e) { return '<i class="' + (e.t ? 'task' : e.c ? 'cal' : '') + ((e.a && DL.agendaState(e.a, now) === 'vencida') || (e.t && DL.isOverdue(e.t, td)) ? ' bad' : '') + '"></i>'; }).join('') + '</span></button>';
    }
    h += '</div>';
    var list = byDay[selDay] || [];

  function kpiChart(def, events) {
    var cfg = DS.config(); var start = cfg.planStart; var end = def.due > start ? def.due : cfg.planEnd;
    var td = today();
    var W = 300, H = 118, L = 6, R = 40, T = 12, B = 22;
    var series = DL.kpiSeries(events, def.key, start);
    var maxV = Math.max(def.target, series.reduce(function (m, p) { return Math.max(m, p.value); }, 0), 1);
    var span = Math.max(1, DL.diffDays(end, start));
    function x(d) { var n = Math.max(0, Math.min(span, DL.diffDays(d, start))); return L + (W - L - R) * n / span; }
    function y(v) { return T + (H - T - B) * (1 - v / maxV); }
    var lastX = x(td < end ? td : end);
    var path = 'M' + x(start).toFixed(1) + ' ' + y(0).toFixed(1); var cur = 0;
    series.slice(1).forEach(function (p) { path += ' H' + x(p.date).toFixed(1) + ' V' + y(p.value).toFixed(1); cur = p.value; });
    path += ' H' + lastX.toFixed(1);
    var area = path + ' V' + y(0).toFixed(1) + ' Z';
    var ty = y(def.target);
    return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Tendencia de ' + esc(def.label) + ': ' + cur + ' de ' + def.target + '">' +
      '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(0) + '" y2="' + y(0) + '" stroke="#E6DCCB"/>' +
      '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + ty + '" y2="' + ty + '" stroke="#00655E" stroke-dasharray="4 4"/>' +
      '<text x="' + (W - R + 4) + '" y="' + (ty + 3) + '">meta ' + def.target + '</text>' +
      '<path d="' + area + '" fill="#FBE7D6"/>' +
      '<path d="' + path + '" fill="none" stroke="#EA632B" stroke-width="2" stroke-linejoin="round"/>' +
      '<circle cx="' + lastX + '" cy="' + y(cur) + '" r="4" fill="#EA632B" stroke="#FCF6EC" stroke-width="2"/>' +
      (Math.abs(y(cur) - ty) > 10 ? '<text class="endlabel" x="' + Math.min(lastX + 7, W - R + 4) + '" y="' + (y(cur) + 4) + '">' + cur + '</text>' : '') +
      '<text x="' + L + '" y="' + (H - 6) + '">' + DL.fmtDate(start, { year: false }) + '</text>' +
      '<text x="' + (W - R) + '" y="' + (H - 6) + '" text-anchor="end">' + DL.fmtDate(end) + '</text></svg>';
  }

    var blocks = DS.list('blocks');

      '<p class="muted">Al cierre de cada trimestre (' + DL.fmtDate(DL.quarterEnd(q)) + '), revisa los modos y registra la decisión. Queda con la foto de los modos en la bitácora.</p>' +

  function vBitacora() {

      var id = ds.id; var f = ds.tfield; var v = t.value; var patch = {};
      if (f === 'title' && !v.trim()) { t.value = task(id).title; return; }
      patch[f] = f === 'title' ? v.trim().slice(0, 160) : f === 'owner' ? (v.trim() || 'Tú') : v;
      if (f === 'phase') patch.order = DL.nextOrder(DS.tasks(), v);
      DS.updateTask(id, patch); render(true); return;
    }
    if (ds.tstatus) {
      var tt = task(ds.tstatus); var ns = t.value;
      if (ns === 'bloqueada') {
        if (!String(tt.blockCause || '').trim()) { U.confirm[tt.id] = 'block'; render(true); var ta = document.getElementById('tb-' + tt.id); if (ta) ta.focus(); return; }
      }
      delete U.confirm[tt.id]; DS.updateTask(tt.id, { status: ns }); render(true); return;
    }
    if (ds.tblock) { var tb = task(ds.tblock); if (tb && tb.status === 'bloqueada' && t.value.trim()) DS.updateTask(tb.id, { blockCause: t.value.trim() }); return; }
    if (ds.ag) {
      var a = S.d.agenda[ds.ag]; if (!a) return; var val = t.value; var pa = {};
      if (ds.f === 'title' && !val.trim()) { t.value = a.title; return; }
      if (ds.f === 'date' && !DL.isDateStr(val)) { t.value = a.date; return; }
      pa[ds.f] = /Min$/.test(ds.f) ? +val : ds.f === 'title' ? val.trim().slice(0, 160) : val;
      setAgenda(a.id, pa); render(true); return;
    }
    if (ds.draft) {
      if (!U.draft) return;
      U.draft[ds.draft] = /Min$/.test(ds.draft) ? +t.value : t.value;
      render(true); return;
    }
    if (ds.lab) {
      var lp = DS.clone(S.d.lab[ds.lab]); var lb = lp[ds.f] || '';
      lp[ds.f] = t.value.trim(); DS.audit('laboratorio', lp.id, lp.name, ds.f, lb, lp[ds.f]); DS.put('lab', lp.id, lp); render(true); return;
    }
    if (ds.cfg) { changeConfig(ds.cfg.split('|'), t); return; }
  });

  function changeConfig(p, input) {
    var kind = p[0], id = p[1], f = p[2], v = input.value.trim();
    var cfg = DS.clone(DS.config());
    if (kind === 'phase') {
      if ((f === 'start' || f === 'end') && !DL.isDateStr(v)) { input.value = cfg.phases[id][f]; return; }
      if (!v) { input.value = cfg.phases[id][f]; return; }
      var b = cfg.phases[id][f]; cfg.phases[id][f] = v; DS.saveConfig({ phases: cfg.phases }, 'Etapa ' + cfg.phases[id].title, f, b, v);
    } else if (kind === 'front') {
      var fr = cfg.fronts[id]; var old = fr[f];
      if (f === 'name') {
        if (!v || DS.fronts().some(function (x) { return x.name === v && x.id !== id; })) { input.value = old; return; }
        DS.tasks().filter(function (t) { return t.front === old; }).forEach(function (t) { DS.updateTask(t.id, { front: v }, { silent: true }); });
        DS.agenda().filter(function (a) { return a.front === old; }).forEach(function (a) { DS.put('agenda', a.id, Object.assign({}, a, { front: v })); });
        DS.list('habits').filter(function (h) { return h.front === old; }).forEach(function (h) { DS.put('habits', h.id, Object.assign({}, h, { front: v })); });
      }
      fr[f] = v; DS.saveConfig({ fronts: cfg.fronts }, 'Frente ' + fr.name, f, old, v);
    } else if (kind === 'kpi') {
      var k = cfg.kpis.filter(function (x) { return x.key === id; })[0]; var ob = k[f];
      if (f === 'target') { var n = Math.round(+v); if (!(n >= 1)) { input.value = ob; return; } v = n; }
      if (f === 'due' && !DL.isDateStr(v)) { input.value = ob; return; }
      if (!v) { input.value = ob; return; }
      k[f] = v; DS.saveConfig({ kpis: cfg.kpis }, 'Indicador ' + k.label, f, ob, v);
    }
    render(true);
  }

  var qTimer = null;
  document.addEventListener('input', function (e) {
    var t = e.target;
    if (t.id === 'cap-text') { U.capText = t.value; return; }
    if (t.dataset.tf === 'q') { clearTimeout(qTimer); qTimer = setTimeout(function () { U.tf.q = t.value; render(true); }, 180); }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey && (e.target.id === 'cap-text' || e.target.id === 'top-cap')) {
      e.preventDefault(); U.capText = e.target.value; doParse(e.target.value);
    }
    if (e.key === 'Escape' && U.more) { U.more = false; renderChrome(); }
    if (e.key === 'Escape') hideTip();
    if ((e.key === 'Enter' || e.key === ' ') && e.target.getAttribute && e.target.getAttribute('role') === 'button' && e.target.dataset.act && e.target.tagName !== 'BUTTON') {
      e.preventDefault(); var fn = ACT[e.target.dataset.act]; if (fn) fn(e.target, e);
    }
  });

  // ───────────── formularios ─────────────
  document.addEventListener('submit', function (e) {
    var f = e.target; var kind = f.dataset.form; if (!kind) return;
    e.preventDefault();
    if (!S.canWrite) return;
    var fd = new FormData(f); var g = function (k) { return String(fd.get(k) || '').trim(); };
    if (kind === 'add-task') {
      if (!g('title')) return;
      var id = DS.addTask({ title: g('title'), phase: g('phase'), front: g('front'), owner: g('owner'), due: g('due') });
      f.reset(); U.open[id] = false; render(true);
      toast({ kicker: 'Actividad agregada', title: g('title') || 'Nueva actividad' });
    } else if (kind === 'add-habit') {
      var hid = DS.newId('h'); var n = DS.list('habits').length + 1;
      DS.put('habits', hid, { id: hid, title: g('title'), freq: g('freq'), target: Math.max(1, +g('target') || 1), days: g('freq') === 'diario' ? [1, 2, 3, 4, 5] : [], when: g('when'), front: '', order: n });
      DS.audit('hábito', hid, g('title'), 'creado', '', g('freq')); f.reset(); render(true);
    } else if (kind === 'block') {
      var b = U.weekEdit; var st = g('start'), en = g('end');
      if (!g('title') || !st || !en || en <= st) { var m = document.getElementById('bk-msg'); if (m) m.textContent = 'Revisa el título y que la hora de fin sea posterior a la de inicio.'; return; }
      var bid = b.id || DS.newId('b');
      var blk = { id: bid, title: g('title'), day: +g('day'), start: st, end: en, cat: g('cat'), note: g('note') };
      DS.audit('semana tipo', bid, blk.title, b.id ? 'editado' : 'creado', b.id ? S.d.blocks[bid].start + '–' + S.d.blocks[bid].end : '', st + '–' + en);
      DS.put('blocks', bid, blk); U.weekEdit = null; render(true);
    } else if (kind === 'mode-review') {
      var q = DL.quarterOf(today()); var modes = {};
      DS.fronts().forEach(function (x) { modes[x.name] = x.mode; });
      var rid = DS.newId('d');
      DS.put('decisions', rid, { id: rid, kind: 'modos', quarter: q, modes: modes, option: 'Revisión trimestral de modos', justification: g('note'), date: today(), at: Date.now(), actor: S.meId || 'app' });
      DS.saveConfig({ modeReview: { quarter: q, date: today(), note: g('note'), updatedAt: Date.now() } }, 'Revisión trimestral ' + q, 'modos', '', JSON.stringify(modes));
      f.reset(); render(true); toast({ kicker: 'Revisión trimestral registrada', title: DL.quarterLabel(q) });
    } else if (kind === 'add-lab') {
      var lid = DS.newId('l');
      DS.put('lab', lid, { id: lid, name: g('name'), description: g('description'), quarter: g('quarter'), exitCriterion: '', decision: '', decisionNote: '', decidedAt: '' });
      DS.audit('laboratorio', lid, g('name'), 'creado', '', g('quarter')); f.reset(); render(true);
    } else if (kind === 'add-front') {
      var cfg = DS.clone(DS.config()); var name = g('name');
      if (!name || DS.fronts().some(function (x) { return x.name === name; })) return;
      var fid = 'f' + Date.now().toString(36);
      cfg.fronts[fid] = { id: fid, name: name, mode: 'explorar', order: DS.fronts().length + 1, scope: '' };
      DS.saveConfig({ fronts: cfg.fronts }, 'Frente ' + name, 'creado', '', name); f.reset(); render(true);
    } else if (kind === 'add-kpi') {
      var c2 = DS.clone(DS.config()); var key = 'k' + Date.now().toString(36);
      if (!DL.isDateStr(g('due'))) return;
      c2.kpis.push({ key: key, label: g('label'), target: Math.max(1, Math.round(+g('target') || 1)), due: g('due'), order: c2.kpis.length + 1 });
      DS.saveConfig({ kpis: c2.kpis }, 'Indicador ' + g('label'), 'creado', '', g('target'));
      f.reset(); render(true);
    }
  });

  // ───────────── arrastrar para ordenar (RF-02) ─────────────
  var drag = null;
  document.addEventListener('dragstart', function (e) {
    var r = e.target.closest && e.target.closest('.trow[draggable="true"]'); if (!r) return;
    drag = { id: r.dataset.task, phase: r.dataset.phase };
    try { e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', drag.id); } catch (x) { }
  });
  document.addEventListener('dragover', function (e) {
    if (!drag) return; var r = e.target.closest && e.target.closest('.trow');
    if (!r || r.dataset.phase !== drag.phase || r.dataset.task === drag.id) return;
    e.preventDefault();
    document.querySelectorAll('.drag-over').forEach(function (n) { n.classList.remove('drag-over'); });
    r.classList.add('drag-over');
  });
  document.addEventListener('drop', function (e) {
    if (!drag) return; var r = e.target.closest && e.target.closest('.trow');
    if (r && r.dataset.phase === drag.phase && r.dataset.task !== drag.id) {
      e.preventDefault();
      var rect = r.getBoundingClientRect(); var after = e.clientY > rect.top + rect.height / 2;
      applyOrder(DL.reorder(DS.tasks(), drag.phase, drag.id, r.dataset.task, after));
      render(true);
    }
    drag = null;
  });
  document.addEventListener('dragend', function () { drag = null; document.querySelectorAll('.drag-over').forEach(function (n) { n.classList.remove('drag-over'); }); });

  window.addEventListener('hashchange', function () { var r = location.hash.slice(1); if (ROUTES.indexOf(r) >= 0 && r !== U.route) navigate(r); });

  // ───────────── arranque ─────────────
  function boot() {
    el = { main: $('#main'), nav: $('#nav'), tabbar: $('#tabbar'), conn: $('#conn'), stamp: $('#stamp'), toasts: $('#toasts'), sheet: $('#sheet') };
    el.tip = document.createElement('div'); el.tip.className = 'tip'; el.tip.setAttribute('role', 'tooltip'); el.tip.hidden = true; document.body.appendChild(el.tip);
    var h = (location.hash || '').slice(1); if (ROUTES.indexOf(h) >= 0) U.route = h;
    U.notif = root.Notification ? (Notification.permission === 'granted' ? 'granted' : Notification.permission === 'denied' ? 'denied' : 'default') : 'unsupported';
    DS.onChange(function (kind) {
      if (kind && kind.toast) { toast({ kind: 'bad', title: kind.toast }); return; }
      if (kind === 'readonly') toast({ title: 'Esta cuenta no puede editar el plan', text: 'La vista quedó en solo lectura.' });
      if (!bootedOnce && DS.ready() && !S.empty) {
        bootedOnce = true;
        setTimeout(function () {
          announceInbox(DS.applyInbox());
          tick(); DS.dailyBackup();
        }, 1500);
      }
      scheduleRender();
    });
    render(true);
    DS.init();
    if (root.claude && typeof root.claude.use === 'function') {
      root.claude.use('sample').then(function (s) { sample = s; U.aiAvailable = !!s; scheduleRender(); }).catch(function () { });
      root.claude.use('downloads').then(function (d) { downloads = d; }).catch(function () { });
    }
    DS.loadCalendar(false);
    setInterval(function () { DS.loadCalendar(false); }, 10 * 60000);
    setInterval(tick, 15000);
    setInterval(function () { if (U.route === 'hoy' || U.route === 'agenda') render(false); else renderChrome(); }, 60000);
  }

  boot();
})(window);

</script>
